<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f3f6f5">
  <meta name="description" content="ตรวจสอบยาด้วย AI: ถ่ายรูปยา พิมพ์หรือพูดชื่อยา และตรวจสอบยาตีกัน">
  <title>ตรวจสอบยา · AI Pill</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="ตรวจยา">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#app" data-i18n="skipToContent">ข้ามไปยังเนื้อหาหลัก</a>

  <header class="appbar">
    <div class="appbar-inner">
      <a href="#/" class="brand">
        <span class="brand-logo" data-icon="logo" aria-hidden="true"></span>
        <span class="brand-name" data-i18n="appName">ตรวจสอบยา</span>
      </a>
      <div class="appbar-actions">
        <button type="button" class="icon-btn" id="btn-display" aria-label="การแสดงผล" data-i18n-aria="display">
          <span class="aa" aria-hidden="true">Aa</span>
        </button>
        <button type="button" class="icon-btn" id="btn-settings" aria-label="ตั้งค่า" data-i18n-aria="settings">
          <span data-icon="gear" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1"></main>

  <footer class="footer container">
    <p data-i18n="footerDisclaimer">ข้อมูลในแอปนี้ใช้ประกอบการตัดสินใจเบื้องต้นเท่านั้น ไม่ใช้แทนคำวินิจฉัยของแพทย์หรือเภสัชกร</p>
  </footer>

  <nav class="tabbar" aria-label="เมนูหลัก" data-i18n-aria="mainMenu">
    <div class="tabbar-inner">
      <a href="#/" class="tab" data-tab="home"><span class="tab-ico" data-icon="home" aria-hidden="true"></span><span class="tab-label" data-i18n="home">หน้าแรก</span></a>
      <a href="#/search" class="tab" data-tab="search"><span class="tab-ico" data-icon="search" aria-hidden="true"></span><span class="tab-label" data-i18n="tabSearch">ค้นหา</span></a>
      <button type="button" class="tab-fab" id="btn-fab-camera" aria-label="ถ่ายรูปยา" data-i18n-aria="takePhoto"><span data-icon="camera" aria-hidden="true"></span></button>
      <a href="#/interactions" class="tab" data-tab="interactions"><span class="tab-ico" data-icon="layers" aria-hidden="true"></span><span class="tab-label" data-i18n="tabIx">ยาตีกัน</span></a>
      <button type="button" class="tab" id="btn-tab-help" data-tab="help"><span class="tab-ico" data-icon="lifebuoy" aria-hidden="true"></span><span class="tab-label" data-i18n="tabHelp">ช่วยเหลือ</span></button>
    </div>
  </nav>

  <!-- hidden inputs for photos -->
  <input type="file" id="file-camera" accept="image/*" capture="environment" class="sr-only" tabindex="-1" aria-hidden="true">
  <input type="file" id="file-gallery" accept="image/*" class="sr-only" tabindex="-1" aria-hidden="true">

  <!-- waiting overlay -->
  <div class="overlay" id="overlay" hidden>
    <div class="overlay-box" role="status" aria-live="assertive">
      <div class="spinner" aria-hidden="true"></div>
      <p class="overlay-title" id="overlay-title"></p>
      <p class="overlay-sub" id="overlay-sub"></p>
      <p class="overlay-sub" id="overlay-elapsed" aria-hidden="true"></p>
      <button type="button" class="btn btn-secondary btn-block" id="btn-cancel-ai" data-i18n="cancel">ยกเลิก</button>
    </div>
  </div>

  <!-- display sheet: text size, contrast, language -->
  <dialog id="dlg-display" class="sheet" aria-labelledby="display-title">
    <form method="dialog" class="sheet-body">
      <div class="sheet-handle" aria-hidden="true"></div>
      <h2 id="display-title" data-i18n="display">การแสดงผล</h2>
      <p class="field-label" id="size-label" data-i18n="textSize">ขนาดตัวอักษร</p>
      <div class="seg seg-size" role="group" aria-labelledby="size-label" id="size-options"></div>
      <div class="setting-row">
        <div>
          <p class="setting-title" id="contrast-label" data-i18n="contrast">คอนทราสต์สูง</p>
          <p class="help" data-i18n="contrastSub">พื้นดำ ตัวอักษรขาว/เหลือง มองเห็นชัดขึ้น</p>
        </div>
        <button type="button" class="switch" id="btn-contrast" role="switch" aria-checked="false" aria-labelledby="contrast-label"><span class="switch-knob"></span></button>
      </div>
      <p class="field-label" id="lang-label" data-i18n="language">ภาษา</p>
      <div class="seg" role="group" aria-labelledby="lang-label" id="lang-options">
        <button type="button" data-lang="th">ไทย</button>
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="zh">中文</button>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-close" data-i18n="done">เสร็จ</button>
    </form>
  </dialog>

  <!-- AI settings sheet -->
  <dialog id="dlg-settings" class="sheet" aria-labelledby="settings-title">
    <form method="dialog" class="sheet-body" id="settings-form">
      <div class="sheet-handle" aria-hidden="true"></div>
      <h2 id="settings-title" data-i18n="settingsTitle">ตั้งค่า AI (ไม่บังคับ)</h2>
      <div class="field">
        <label for="api-key" data-i18n="apiKeyLabel">Anthropic API Key</label>
        <input type="password" id="api-key" class="input" autocomplete="off" spellcheck="false" placeholder="sk-ant-…">
        <p class="help" data-i18n="apiKeyHelp"></p>
      </div>
      <div class="field">
        <label for="api-model" data-i18n="modelLabel">โมเดล Claude</label>
        <input type="text" id="api-model" class="input" autocomplete="off" spellcheck="false">
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-primary" id="btn-save-settings" data-i18n="save">บันทึก</button>
        <button type="button" class="btn btn-ghost" id="btn-clear-key" data-i18n="clearKey">ลบคีย์</button>
      </div>
      <button type="submit" class="btn btn-secondary btn-block btn-close" data-i18n="close">ปิด</button>
    </form>
  </dialog>

  <!-- help sheet: emergency numbers and pharmacist -->
  <dialog id="dlg-pharmacist" class="sheet" aria-labelledby="pharm-title">
    <form method="dialog" class="sheet-body">
      <div class="sheet-handle" aria-hidden="true"></div>
      <h2 id="pharm-title" data-i18n="pharmTitle">ปรึกษาเภสัชกร</h2>
      <div id="pharm-options" class="stack"></div>
      <p class="help" data-i18n="pharmBringPack"></p>
      <button type="submit" class="btn btn-secondary btn-block btn-close" data-i18n="close">ปิด</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="live" class="sr-only" aria-live="polite"></div>

  <script src="js/i18n.js"></script>
  <script src="js/drugs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
